# Nginx (Caddy ўрнига). /etc/nginx/sites-available/ekomun га қўйинг, сўнг:
#   sudo ln -s /etc/nginx/sites-available/ekomun /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d ekomun.uz
server {
    listen 80;
    server_name ekomun.uz;
    client_max_body_size 8m;   # Эко-кўз расмлари учун

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
