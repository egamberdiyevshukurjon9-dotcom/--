# Render Blueprint — Ekomun
# Render'да: New → Blueprint → шу репозиторийни танланг. ADMIN_PASSWORD ни ўзингиз киритасиз.
services:
  - type: web
    name: ekomun
    runtime: node
    plan: starter # Пулли режим: доимий диск фақат шунда ишлайди (бепулда маълумотлар ҳар деплойда ўчади)
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TRUST_PROXY
        value: "1" # Render прокси ортида: мижоз IP си X-Forwarded-For дан олинади
      - key: ADMIN_PASSWORD
        sync: false # Render сиздан паролни сўрайди, у репозиторийга ёзилмайди
      - key: ACCOUNT_SECRET
        generateValue: true # Ҳисоб калити (eko_pass) учун: сервер ухлаб уйғонганда ҳам ҳисоблар тикланади
      - key: ADMIN_PATH
        sync: false # Бошқарув марказининг махфий манзили, масалан /boshqaruv-7k2q
      - key: ADMIN_TOTP_SECRET
        sync: false # Икки босқичли ҳимоя: node tools/admin-totp.js чиқарган калит
      - key: CONTACT_EMAIL
        sync: false # Махфийлик сиёсатида кўрсатиладиган почтангиз
      - key: ANTHROPIC_API_KEY
        sync: false # «Эко-кўз» учун Claude API калити (platform.claude.com). Ҳеч кимга берманг
      - key: ANDROID_SHA256
        sync: false # Google Play иловаси учун: Play Console → App signing даги SHA-256 изи
      - key: DATA_DIR
        value: /var/data # Доимий диск: ҳисоблар, «Кирди-чиқди» журнали, статистика деплойдан кейин ҳам сақланади
      - key: GITHUB_BACKUP_REPO
        sync: false # Ихтиёрий қўшимча ҳимоя: ЁПИҚ репозиторий (owner/repo) — маълумотлар шифрланиб шу ерга ҳам ёзилади
      - key: GITHUB_BACKUP_TOKEN
        sync: false # Fine-grained token: фақат шу репо, Contents: Read and write
    disk:
      name: ekomun-data
      mountPath: /var/data
      sizeGB: 1
    # Бепул (free) режимда диск йўқ: plan: free қилинса, DATA_DIR ва disk қаторларини олиб ташланг ва
    # маълумотлар сақланиши учун GITHUB_BACKUP_REPO + GITHUB_BACKUP_TOKEN беринг (zaxira.js).
