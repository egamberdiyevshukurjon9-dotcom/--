<!doctype html>
<html lang="uz-Cyrl" class="eko-aurora">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef6f1">
<meta name="robots" content="noindex">
<title>Сертификатни текшириш · Ekomun</title>
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/vendor/eko-ui.css">
<script>try { var t = localStorage.getItem("ekotalim:theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) { /* ignore */ }</script>
<style>
:root { --card: rgba(255, 255, 255, .8); --text: #0b1f17; --muted: #4a5f56; --line: rgba(4, 120, 87, .14); --primary: #047857; --ok: #047857; --ok-bg: #d1fae5; --bad: #b91c1c; --bad-bg: #fee2e2; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --card: rgba(16, 34, 27, .78); --text: #e8f5ef; --muted: #9fbbaf; --line: rgba(167, 243, 208, .12); --primary: #34d399; --ok: #6ee7b7; --ok-bg: rgba(16, 185, 129, .16); --bad: #fca5a5; --bad-bg: rgba(239, 68, 68, .16); }
}
:root[data-theme="dark"] { --card: rgba(16, 34, 27, .78); --text: #e8f5ef; --muted: #9fbbaf; --line: rgba(167, 243, 208, .12); --primary: #34d399; --ok: #6ee7b7; --ok-bg: rgba(16, 185, 129, .16); --bad: #fca5a5; --bad-bg: rgba(239, 68, 68, .16); }
* { box-sizing: border-box; }
body { margin: 0; color: var(--text); font-family: var(--eko-font); line-height: 1.6; -webkit-font-smoothing: antialiased; }
main { max-width: 560px; margin: 0 auto; padding: calc(32px + env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) calc(48px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
a { color: var(--primary); }
h1 { font-size: clamp(1.6rem, 5vw, 2.1rem); line-height: 1.15; margin: 20px 0 6px; letter-spacing: -.02em; font-weight: 800; }
.muted { color: var(--muted); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 22px; margin-top: 18px; box-shadow: 0 1px 2px rgba(6, 40, 28, .05), 0 10px 30px -10px rgba(6, 40, 28, .16); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
.back { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 8px 16px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); text-decoration: none; color: var(--text); font-weight: 600; }
.status { display: inline-flex; gap: 8px; align-items: center; padding: 6px 14px; border-radius: 999px; font-weight: 700; }
.status.ok { color: var(--ok); background: var(--ok-bg); }
.status.bad { color: var(--bad); background: var(--bad-bg); }
dl { display: grid; grid-template-columns: max-content 1fr; gap: 8px 16px; margin: 18px 0 0; }
dt { color: var(--muted); }
dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
form { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
input { flex: 1; min-width: 180px; min-height: 44px; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--text); font: inherit; text-transform: uppercase; }
button { min-height: 44px; padding: 10px 18px; border-radius: 12px; border: 0; background: var(--eko-btn); color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
.langs { display: flex; gap: 6px; float: right; }
.langs button { min-height: 36px; padding: 4px 10px; background: var(--card); color: var(--text); border: 1px solid var(--line); font-weight: 600; }
.langs button[aria-pressed="true"] { border-color: var(--primary); color: var(--primary); }
</style>
</head>
<body>
<main>
  <div class="langs" role="group" aria-label="Тил"><button type="button" data-l="cyr">Ўз</button><button type="button" data-l="lat">Oʻz</button><button type="button" data-l="ru">Ру</button><button type="button" data-l="en">En</button></div>
  <a class="back" href="/"><span aria-hidden="true">←</span> Ekomun</a>
  <h1 id="h"></h1>
  <p class="muted" id="lead"></p>
  <div class="card" id="out" aria-live="polite"></div>
  <form id="f"><input id="code" placeholder="EKM-XXXXXXXXXX" maxlength="14" autocomplete="off" aria-label="Код"><button id="go"></button></form>
</main>
<script>
(function () {
  "use strict";
  var TX = {
    cyr: { h: "Сертификатни текшириш", lead: "Ekomun платформаси берган сертификат ҳақиқийлигини QR код ёки текшириш коди орқали текширинг.", go: "Текшириш", ok: "✓ Ҳақиқий сертификат", bad: "✕ Сертификат топилмади", badText: "Код нотўғри ёки бундай сертификат берилмаган. Кодни сертификатдагидек киритинг.", name: "Эгаси", course: "Курс", date: "Берилган сана", exam: "Якуний тест", lessons: "Дарслар", code: "Код", wait: "Текширилмоқда…", empty: "Сертификатдаги кодни киритинг (масалан, EKM-1A2B3C4D5E).", net: "Сервер билан алоқа йўқ. Интернетни текшириб, қайта уриниб кўринг." },
    lat: { h: "Sertifikatni tekshirish", lead: "Ekomun platformasi bergan sertifikat haqiqiyligini QR kod yoki tekshirish kodi orqali tekshiring.", go: "Tekshirish", ok: "✓ Haqiqiy sertifikat", bad: "✕ Sertifikat topilmadi", badText: "Kod noto‘g‘ri yoki bunday sertifikat berilmagan. Kodni sertifikatdagidek kiriting.", name: "Egasi", course: "Kurs", date: "Berilgan sana", exam: "Yakuniy test", lessons: "Darslar", code: "Kod", wait: "Tekshirilmoqda…", empty: "Sertifikatdagi kodni kiriting (masalan, EKM-1A2B3C4D5E).", net: "Server bilan aloqa yo‘q. Internetni tekshirib, qayta urinib ko‘ring." },
    ru: { h: "Проверка сертификата", lead: "Проверьте подлинность сертификата платформы Ekomun по QR-коду или коду проверки.", go: "Проверить", ok: "✓ Сертификат подлинный", bad: "✕ Сертификат не найден", badText: "Код неверный или такой сертификат не выдавался. Введите код так, как он указан в сертификате.", name: "Владелец", course: "Курс", date: "Дата выдачи", exam: "Итоговый тест", lessons: "Уроков", code: "Код", wait: "Проверяем…", empty: "Введите код из сертификата (например, EKM-1A2B3C4D5E).", net: "Нет связи с сервером. Проверьте интернет и попробуйте снова." },
    en: { h: "Verify a certificate", lead: "Check that an Ekomun certificate is genuine using its QR code or verification code.", go: "Verify", ok: "✓ Genuine certificate", bad: "✕ Certificate not found", badText: "The code is wrong or no such certificate was issued. Enter the code exactly as printed.", name: "Holder", course: "Course", date: "Issued on", exam: "Final test", lessons: "Lessons", code: "Code", wait: "Checking…", empty: "Enter the code from the certificate (e.g. EKM-1A2B3C4D5E).", net: "No connection to the server. Check the internet and try again." }
  };
  var lang = "cyr";
  try { lang = localStorage.getItem("ekotalim:lang") || "cyr"; } catch (e) { /* ignore */ }
  if (!TX[lang]) lang = "cyr";
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  var last = null;
  function t(k) { return TX[lang][k]; }
  function paint() {
    document.documentElement.lang = { cyr: "uz-Cyrl", lat: "uz-Latn", ru: "ru", en: "en" }[lang];
    $("h").textContent = t("h"); $("lead").textContent = t("lead"); $("go").textContent = t("go");
    document.title = t("h") + " · Ekomun";
    [].forEach.call(document.querySelectorAll("[data-l]"), function (b) { b.setAttribute("aria-pressed", String(b.dataset.l === lang)); });
    render(last);
  }
  function render(r) {
    var o = $("out");
    if (!r) { o.innerHTML = '<p class="muted" style="margin:0">' + esc(t("empty")) + "</p>"; return; }
    if (r.wait) { o.innerHTML = '<p class="muted" style="margin:0">' + esc(t("wait")) + "</p>"; return; }
    if (r.net) { o.innerHTML = '<p style="margin:0">' + esc(t("net")) + "</p>"; return; }
    if (!r.ok) { o.innerHTML = '<span class="status bad">' + esc(t("bad")) + '</span><p class="muted">' + esc(t("badText")) + "</p>"; return; }
    var d = new Date(r.at);
    var date = String(d.getDate()).padStart(2, "0") + "." + String(d.getMonth() + 1).padStart(2, "0") + "." + d.getFullYear();
    o.innerHTML = '<span class="status ok">' + esc(t("ok")) + "</span><dl>" +
      "<dt>" + esc(t("name")) + "</dt><dd>" + esc(r.name) + "</dd>" +
      "<dt>" + esc(t("course")) + "</dt><dd>" + esc(r.title) + "</dd>" +
      (r.lessons ? "<dt>" + esc(t("lessons")) + "</dt><dd>" + esc(r.lessons) + "</dd>" : "") +
      (r.pct ? "<dt>" + esc(t("exam")) + "</dt><dd>" + esc(r.pct) + "%</dd>" : "") +
      "<dt>" + esc(t("date")) + "</dt><dd>" + date + "</dd>" +
      "<dt>" + esc(t("code")) + "</dt><dd>" + esc(r.code) + "</dd></dl>";
  }
  function check(code) {
    code = String(code || "").trim().toUpperCase();
    if (!code) { last = null; return render(null); }
    last = { wait: true }; render(last);
    fetch("/api/cert?c=" + encodeURIComponent(code)).then(function (res) {
      if (res.status === 404) return { ok: false };
      return res.ok ? res.json() : { net: true };
    }).catch(function () { return { net: true }; }).then(function (r) { last = r; render(r); });
  }
  document.addEventListener("click", function (e) {
    var b = e.target.closest("[data-l]");
    if (b) { lang = b.dataset.l; try { localStorage.setItem("ekotalim:lang", lang); } catch (x) { /* ignore */ } paint(); }
  });
  $("f").addEventListener("submit", function (e) { e.preventDefault(); history.replaceState(null, "", "?c=" + encodeURIComponent($("code").value.trim().toUpperCase())); check($("code").value); });
  var c = new URLSearchParams(location.search).get("c") || "";
  $("code").value = c;
  paint();
  if (c) check(c);
})();
</script>
</body>
</html>
