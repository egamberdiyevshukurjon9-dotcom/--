<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1f17">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Ekomun · Pitch deck</title>
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/vendor/eko-ui.css">
<style>
/* Pitch deck кўриш саҳифаси (DocSend ўрнига): /d/<калит>. Скрипт: /vendor/eko-deck.js */
:root { --bg: #0b1f17; --card: #12291f; --text: #e8f5ef; --muted: #9fbbaf; --line: rgba(167, 243, 208, .16); --primary: #34d399; --on-primary: #052e1f; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--eko-font, system-ui, sans-serif); line-height: 1.5; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; }
header { display: flex; align-items: center; gap: 12px; padding: calc(10px + env(safe-area-inset-top)) 16px 10px; border-bottom: 1px solid var(--line); }
header img { width: 30px; height: 30px; }
header b { font-size: 1rem; }
header .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
main { flex: 1; display: grid; place-items: center; padding: 16px; min-height: 0; position: relative; }
.gate { width: min(440px, 100%); background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 24px; display: grid; gap: 14px; }
.gate h1 { margin: 0; font-size: 1.4rem; line-height: 1.25; }
.gate p { margin: 0; color: var(--muted); }
input[type=email] { width: 100%; min-height: 48px; padding: 10px 14px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--bg); color: var(--text); font: inherit; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 10px 20px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); color: var(--text); font: inherit; font-weight: 700; cursor: pointer; text-decoration: none; }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.btn:disabled { opacity: .5; cursor: default; }
.err { color: #fca5a5; min-height: 1.2em; }
#stage { width: 100%; height: 100%; display: grid; place-items: center; touch-action: pan-y; }
canvas { max-width: 100%; max-height: calc(100vh - 150px); max-height: calc(100dvh - 150px); border-radius: 10px; box-shadow: 0 20px 50px -20px rgba(0, 0, 0, .7); background: #fff; }
footer { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 10px; padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); }
footer .n { min-width: 90px; text-align: center; font-variant-numeric: tabular-nums; }
.note { width: 100%; text-align: center; font-size: .8rem; color: var(--muted); }
.loading { color: var(--muted); }
[hidden] { display: none !important; }
</style>
</head>
<body>
<header><img src="/icons/icon.svg" alt=""><b>Ekomun</b><span class="t" id="dkTitle"></span><a class="btn" id="dkDl" hidden download>⬇</a></header>
<main>
  <form class="gate" id="dkGate" hidden novalidate>
    <h1 id="dkGateT"></h1>
    <p id="dkGateP"></p>
    <input type="email" id="dkEmail" autocomplete="email" required>
    <p class="err" id="dkErr" role="alert"></p>
    <button class="btn primary" type="submit" id="dkGo"></button>
  </form>
  <p class="loading" id="dkMsg" role="status"></p>
  <div id="stage" hidden><canvas id="dkCanvas" role="img"></canvas></div>
</main>
<footer id="dkBar" hidden>
  <button class="btn" type="button" id="dkPrev" aria-label="←">←</button>
  <span class="n" id="dkN" aria-live="polite"></span>
  <button class="btn" type="button" id="dkNext" aria-label="→">→</button>
  <button class="btn" type="button" id="dkFs" aria-label="⛶">⛶</button>
  <p class="note" id="dkNote"></p>
</footer>
<script src="/vendor/eko-deck.js" type="module"></script>
</body>
</html>
